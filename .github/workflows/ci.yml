name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: vvedantb/packages/.github/workflows/ci-app.yml@main
    with:
      package_manager: npm
      runs_on: boat-large
      timeout_minutes: 15
      # The package must build first: the demos and site import its dist output.
      # Playwright e2e stays out of CI on purpose (browsers and demos), as before.
      keep_going: false
      commands: |
        npm run build
        npm run typecheck
        npm run lint
        npm run lint:tests
        npm test
