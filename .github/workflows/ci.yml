name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The package must build first: the demos and site import its dist output.
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Lint tests
        run: npm run lint:tests
      - name: Test
        run: npm test
      # Playwright e2e stays out of CI on purpose (browsers and demos).
      # Run it locally with `npm run test:e2e`.
